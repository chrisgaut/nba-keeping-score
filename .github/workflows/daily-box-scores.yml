name: Daily box scores

on:
  schedule:
    # Cron runs in UTC with no daylight saving: 12:00 UTC is 8 AM EDT
    # (Mar-Nov) and 7 AM EST (Nov-Mar). GitHub may start scheduled runs late.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Night to email (YYYY-MM-DD). Leave blank for last night (Eastern)."
        required: false
        default: ""
      dry_run:
        description: "Build the email without sending it"
        type: boolean
        default: false

permissions:
  contents: write # commit schedule/player updates back to the repo

concurrency:
  group: daily-box-scores
  cancel-in-progress: false

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv # the R version recorded in renv.lock
          use-public-rspm: true # prebuilt Linux binaries, much faster installs

      - uses: r-lib/actions/setup-renv@v2

      - name: Build and send email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Inputs are passed through env (not pasted into the script) so
          # their text can never run as shell code.
          INPUT_DATE: ${{ inputs.date }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ -n "$INPUT_DATE" ]; then args+=(--date "$INPUT_DATE"); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          Rscript R/main.R "${args[@]}"

      - name: Save email for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit schedule and player updates
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes"
            exit 0
          fi
          git commit -m "Update schedule and player data ($(TZ=America/New_York date +%Y-%m-%d)) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
